<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" fill="none">
  <title>Technology Mindz — simplified multi-agent workflow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8CE4D6"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#74849A"/>
    </marker>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E8EEF4" fill-opacity="0.07"/>
    </pattern>
    <style>
      .t { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: #E8EEF4; font-size: 19px; font-weight: 600; }
      .s { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: #91A0B2; font-size: 14px; }
      .m { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; font-size: 11.5px; letter-spacing: 1.6px; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#0B1118"/>
  <rect width="1200" height="640" fill="url(#dots)"/>

  <!-- LangGraph boundary -->
  <rect x="270" y="60" width="670" height="530" rx="18" stroke="#8CE4D6" stroke-opacity="0.28" stroke-dasharray="6 8"/>
  <text x="292" y="90" class="m" fill="#8CE4D6">LANGGRAPH · STATE GRAPH</text>
  <text x="990" y="50" class="m" fill="#74849A">EXTERNAL SERVICES</text>

  <!-- Lead data -->
  <rect x="40" y="275" width="180" height="80" rx="12" fill="#121A25" stroke="#E8EEF4" stroke-opacity="0.18"/>
  <text x="62" y="300" class="m" fill="#74849A">INPUT</text>
  <text x="62" y="327" class="t">Lead data</text>
  <text x="62" y="345" class="s">inbound leads</text>

  <!-- MongoDB -->
  <rect x="40" y="430" width="180" height="70" rx="12" fill="#0E151E" stroke="#E8EEF4" stroke-opacity="0.12"/>
  <text x="62" y="460" class="t" style="font-size:17px">MongoDB</text>
  <text x="62" y="482" class="s">persistence</text>
  <path d="M130 355 V430" stroke="#74849A" stroke-dasharray="4 5"/>

  <!-- Lead data -> Profiler -->
  <path d="M220 315 H296" stroke="#8CE4D6" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Profiler -->
  <rect x="300" y="262" width="210" height="106" rx="14" fill="#8CE4D6" fill-opacity="0.07" stroke="#8CE4D6" stroke-opacity="0.75" stroke-width="1.4"/>
  <text x="322" y="290" class="m" fill="#8CE4D6">AGENT 01</text>
  <text x="322" y="320" class="t">Lead Profiler</text>
  <text x="322" y="344" class="s">analyse · classify</text>

  <!-- Groq -->
  <rect x="300" y="440" width="210" height="70" rx="12" fill="#0E151E" stroke="#E8EEF4" stroke-opacity="0.12"/>
  <text x="322" y="470" class="t" style="font-size:17px">Groq · Llama 3.3 70B</text>
  <text x="322" y="492" class="s">LLM inference</text>
  <path d="M405 368 V440" stroke="#74849A" stroke-dasharray="4 5"/>

  <!-- Router -->
  <path d="M510 315 H564" stroke="#8CE4D6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M600 281 L634 315 L600 349 L566 315 Z" fill="#121A25" stroke="#A89AF7" stroke-opacity="0.85" stroke-width="1.4"/>
  <text x="600" y="320" class="m" fill="#A89AF7" text-anchor="middle">IF</text>
  <text x="600" y="376" class="m" fill="#74849A" text-anchor="middle">CLASSIFICATION</text>

  <!-- Branches -->
  <path d="M600 281 V155 H686" stroke="#8CE4D6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="614" y="214" class="m" fill="#E8EEF4">WARM</text>
  <path d="M600 349 V475 H686" stroke="#8CE4D6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="614" y="430" class="m" fill="#E8EEF4">HOT</text>

  <!-- Nurture -->
  <rect x="690" y="102" width="220" height="106" rx="14" fill="#8CE4D6" fill-opacity="0.07" stroke="#8CE4D6" stroke-opacity="0.75" stroke-width="1.4"/>
  <text x="712" y="130" class="m" fill="#8CE4D6">AGENT 02</text>
  <text x="712" y="160" class="t">Lead Nurture</text>
  <text x="712" y="184" class="s">RAG-grounded outreach</text>

  <!-- Scheduler -->
  <rect x="690" y="422" width="220" height="106" rx="14" fill="#8CE4D6" fill-opacity="0.07" stroke="#8CE4D6" stroke-opacity="0.75" stroke-width="1.4"/>
  <text x="712" y="450" class="m" fill="#8CE4D6">AGENT 03</text>
  <text x="712" y="480" class="t">Meeting Scheduler</text>
  <text x="712" y="504" class="s">book a meeting</text>

  <!-- Services -->
  <rect x="990" y="72" width="180" height="84" rx="12" fill="#0E151E" stroke="#E8EEF4" stroke-opacity="0.14"/>
  <text x="1010" y="104" class="t" style="font-size:16px">Case-study retrieval</text>
  <text x="1010" y="126" class="s" style="font-size:13px">FAISS · Sentence</text>
  <text x="1010" y="143" class="s" style="font-size:13px">Transformers</text>
  <path d="M910 132 H950 V114 H986" stroke="#74849A" stroke-width="1.3" marker-start="url(#arrow-muted)" marker-end="url(#arrow-muted)"/>

  <rect x="990" y="214" width="180" height="70" rx="12" fill="#0E151E" stroke="#E8EEF4" stroke-opacity="0.14"/>
  <text x="1010" y="244" class="t" style="font-size:16px">Mailgun</text>
  <text x="1010" y="266" class="s" style="font-size:13px">email delivery</text>
  <path d="M910 182 H950 V249 H986" stroke="#74849A" stroke-width="1.3" marker-end="url(#arrow-muted)"/>

  <rect x="990" y="436" width="180" height="84" rx="12" fill="#0E151E" stroke="#E8EEF4" stroke-opacity="0.14"/>
  <text x="1010" y="468" class="t" style="font-size:16px">Google Calendar</text>
  <text x="1010" y="490" class="s" style="font-size:13px">events · Meet links</text>
  <path d="M910 476 H986" stroke="#74849A" stroke-width="1.3" marker-end="url(#arrow-muted)"/>

  <text x="40" y="618" class="m" fill="#74849A">SIMPLIFIED OVERVIEW — FULL DIAGRAM ON EXCALIDRAW</text>
</svg>
